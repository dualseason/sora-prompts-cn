<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="围绕《丧尸清道夫》完整拉片展开的提示词课与AI自媒体电影课。">
  <title>课程加载中｜丧尸清道夫 AI 电影课</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --ink:#17202a; --muted:#65717d; --paper:#f7f8f5; --line:#dfe4df; --accent:#176b5b; --soft:#ece9e1; --warm:#d56b3d; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:16px/1.9 "Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
    a { color:var(--accent); }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .bar, main { width:min(1120px, calc(100% - 40px)); margin:auto; }
    .bar { min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { color:var(--ink); font-weight:750; text-decoration:none; white-space:nowrap; }
    nav { display:flex; gap:18px; flex-wrap:wrap; justify-content:flex-end; }
    nav a { color:var(--muted); font-size:14px; text-decoration:none; white-space:nowrap; }
    .course-head { padding:58px 0 42px; background:#fff; border-bottom:1px solid var(--line); }
    .eyebrow { margin:0 0 12px; color:var(--warm); font-size:13px; font-weight:750; }
    h1 { max-width:820px; margin:0; font-size:clamp(34px,5vw,58px); line-height:1.25; letter-spacing:0; }
    .lead { max-width:760px; margin:18px 0 0; color:var(--muted); font-size:18px; }
    .layout { display:grid; grid-template-columns:210px minmax(0,1fr); gap:64px; padding-top:46px; }
    aside { position:sticky; top:20px; align-self:start; }
    aside h2 { margin:0 0 12px; font-size:15px; }
    aside a { display:block; padding:5px 0; color:var(--muted); font-size:14px; text-decoration:none; }
    article { min-width:0; padding-bottom:70px; }
    article h1 { display:none; }
    article h2 { margin:52px 0 15px; padding-top:16px; border-top:1px solid var(--line); font-size:29px; line-height:1.45; }
    article h3 { margin-top:32px; font-size:22px; line-height:1.5; }
    article h4 { margin-top:24px; font-size:18px; }
    article p, article ul, article ol, article table { max-width:850px; }
    article blockquote { margin:24px 0; padding:12px 18px; color:#4f625d; background:var(--soft); border-left:3px solid var(--accent); }
    article pre { overflow:auto; padding:18px 20px; color:#edf4ef; background:#182b2a; border-left:4px solid var(--warm); border-radius:4px; line-height:1.8; }
    article code { padding:2px 5px; background:#eef1ee; border-radius:3px; }
    article pre code { padding:0; color:inherit; background:none; }
    table { width:100%; border-collapse:collapse; margin:20px 0; font-size:14px; }
    th, td { padding:10px 12px; border:1px solid var(--line); text-align:left; vertical-align:top; }
    th { background:var(--soft); font-weight:700; }
    footer { padding:28px 0 48px; color:var(--muted); border-top:1px solid var(--line); font-size:14px; }
    @media (max-width:760px) {
      .bar, main { width:min(100% - 28px, 1120px); }
      .bar { align-items:flex-start; padding:15px 0; }
      nav { gap:6px 14px; }
      .course-head { padding:42px 0 34px; }
      .layout { grid-template-columns:1fr; gap:0; padding-top:30px; }
      aside { display:none; }
      article h2 { font-size:25px; }
      th, td { padding:8px; }
    }
  </style>
  <link rel="stylesheet" href="./book.css?v=15">
</head>
<body>
  <header class="plain-header"><div class="plain-header-inner">
    <a class="plain-brand" href="./">丧尸清道夫 AI 电影课</a>
    <nav><a href="./seedance-workflow.html">流程总览</a><a href="./course.html?doc=zombie-scavenger-shot-analysis.md">原片拉片</a><a href="./image-prompts.html">图片图库</a><button class="theme-toggle" data-theme-toggle type="button">切换暗色</button></nav>
  </div></header>
  <section class="course-head"><main>
    <p class="eyebrow">中文长课</p>
    <h1 id="title">课程加载中</h1>
    <p class="lead" id="lead">正在载入课程内容……</p>
  </main></section>
  <section class="official-video" id="official-video" hidden>
    <div class="official-video-inner">
      <div class="official-video-frame"><iframe id="official-video-player" title="Mx-Shell《丧尸清道夫》官方原片" allowfullscreen scrolling="no" frameborder="0"></iframe></div>
      <p>原片由 Mx-Shell 发布，播放器由 B 站提供。<a href="https://www.bilibili.com/video/BV1FFRQB2Eqw/" target="_blank" rel="noopener noreferrer">在 B 站打开官方原片</a></p>
    </div>
  </section>
  <main class="layout">
    <aside><h2>章节导航</h2><div id="toc"></div></aside>
    <article id="content"><p>正在载入课程内容……</p></article>
  </main>
  <footer><main>围绕《丧尸清道夫》80镜拉片展开的中文AI电影学习资料。模型能力会更新，请以实际界面与官方文档为准。</main></footer>
  <script>
    const params = new URLSearchParams(location.search);
    const doc = params.get('doc') || 'prompt-course.md';
    const names = {
      'prompt-course.md': ['第一节课：《丧尸清道夫》提示词拆解课', '从80镜拉片反推角色、场景、首帧、动作和图生视频提示词。'],
      'ai-media-course.md': ['第二节课：从《丧尸清道夫》学习 AI 自媒体电影', '从成片反推选题、故事、生产、剪辑、发布和系列化。'],
      'zombie-scavenger-shot-analysis.md': ['《丧尸清道夫》完整文字拉片', '按时间码拆解官方重制版的 80 个教学镜头单元。']
    };
    const meta = names[doc] || names['prompt-course.md'];
    document.title = meta[0] + '｜丧尸清道夫 AI 电影课';
    document.getElementById('title').textContent = meta[0];
    document.getElementById('lead').textContent = meta[1];
    if (doc === 'zombie-scavenger-shot-analysis.md') {
      document.getElementById('official-video').hidden = false;
      document.getElementById('official-video-player').src = 'https://player.bilibili.com/player.html?bvid=BV1FFRQB2Eqw&page=1&high_quality=1&danmaku=0';
    }
    fetch('./' + doc).then(function (response) {
      if (!response.ok) throw new Error('课程加载失败');
      return response.text();
    }).then(function (markdown) {
      marked.setOptions({ mangle: false });
      document.getElementById('content').innerHTML = marked.parse(markdown);
      const toc = document.getElementById('toc');
      document.querySelectorAll('#content h2, #content h3').forEach(function (heading, index) {
        heading.id = 'section-' + (index + 1);
        const link = document.createElement('a');
        link.href = '#' + heading.id;
        link.textContent = heading.textContent;
        link.addEventListener('click', function (event) {
          event.preventDefault();
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', '#' + heading.id);
        });
        toc.appendChild(link);
      });
      if (doc === 'zombie-scavenger-shot-analysis.md') {
        var segmentStyles = [
          { end: 18, text: '原子朋克末日海滨，1980年代复古未来主义，豪华流线型滨海别墅与废墟并存，强烈日光，青蓝海水，暖金高光，低饱和电影调色' },
          { end: 31, text: '末日滨海别墅室内，曲线现代主义建筑，落地窗、吧台和海景，写实材质，明暗对比，荒诞黑色喜剧气质' },
          { end: 46, text: '1980年代美国西海岸末日公路，废弃汽车、感染体和残骸，正午硬光，尘土与爆炸，写实动作电影质感' },
          { end: 52, text: '1989年美国西海岸废墟小镇，汽车旅馆、复古轿车和棕榈树，正午阳光，宽银幕公路电影质感' },
          { end: 62, text: '末日小镇爱情段落，服装店橱窗、红色连衣裙与复古餐厅，红色视觉焦点，柔和逆光，荒诞浪漫电影质感' },
          { end: 69, text: '末日爱情记忆蒙太奇，公园、游乐场、敞篷车和理发店，复古胶片感，温暖生活化光线，轻快浪漫' },
          { end: 74, text: '末日城市日落与逃亡，橙紫色天空、废墟发射场和小型飞船，史诗逆光，浪漫与危险并存' },
          { end: 80, text: '近地轨道复古飞船舱内，舷窗外蓝色地球，低照度暖色舱灯，安静克制的科幻尾声' }
        ];
        function styleFor(number) {
          return segmentStyles.find(function (item) { return number <= item.end; }).text;
        }
        function durationFor(value) {
          var parts = value.split('–');
          function toSeconds(time) {
            var match = time.match(/(\d{2}):(\d{2}(?:\.\d+)?)/);
            return match ? Number(match[1]) * 60 + Number(match[2]) : 0;
          }
          return Math.max(1, Math.round((toSeconds(parts[1] || '') - toSeconds(parts[0] || '')) * 10) / 10);
        }
        function addPromptBlock(parent, title, text) {
          var heading = document.createElement('strong');
          heading.textContent = title;
          var prompt = document.createElement('p');
          prompt.className = 'shot-prompt-text';
          prompt.textContent = text;
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'shot-copy-button';
          button.textContent = '复制';
          button.addEventListener('click', function () {
            navigator.clipboard.writeText(text).then(function () {
              button.textContent = '已复制';
              setTimeout(function () { button.textContent = '复制'; }, 1200);
            });
          });
          parent.appendChild(heading);
          parent.appendChild(button);
          parent.appendChild(prompt);
        }
        document.querySelectorAll('#content tbody tr').forEach(function (row) {
          var cells = row.querySelectorAll('td');
          if (cells.length < 4 || !/^\d+$/.test(cells[0].textContent.trim())) return;
          var number = Number(cells[0].textContent.trim());
          if (number < 1 || number > 80) return;
          row.closest('table').classList.add('shot-analysis-table');
          var image = document.createElement('img');
          image.className = 'shot-row-image';
          image.loading = 'lazy';
          image.decoding = 'async';
          image.src = './images/shot-analysis/shots/shot-' + String(number).padStart(3, '0') + '.webp';
          image.alt = '《丧尸清道夫》镜头 ' + number + ' 代表帧';
          var timeMatch = cells[1].textContent.trim().match(/^(\d{2}):(\d{2})/);
          var seconds = timeMatch ? Number(timeMatch[1]) * 60 + Number(timeMatch[2]) : 0;
          var imageLink = document.createElement('a');
          imageLink.className = 'shot-row-link';
          imageLink.href = 'https://www.bilibili.com/video/BV1FFRQB2Eqw/?t=' + seconds;
          imageLink.target = '_blank';
          imageLink.rel = 'noopener noreferrer';
          imageLink.title = '在 B 站官方原片中查看镜头 ' + number;
          imageLink.appendChild(image);
          var hint = document.createElement('span');
          hint.className = 'shot-row-hint';
          hint.textContent = '查看官方原片对应时间 →';
          imageLink.appendChild(hint);
          cells[2].prepend(imageLink);
          var visual = cells[2].textContent.replace('查看官方原片对应时间 →', '').trim();
          var narrative = cells[3].textContent.trim();
          var style = styleFor(number);
          var imagePrompt = style + '。' + visual + '。主体和环境关系清楚，保持宽银幕 2.33:1 构图，写实电影摄影，真实金属、皮肤、羽毛、混凝土和织物材质，景深自然，光线方向明确，不添加字幕、水印、品牌或额外人物。';
          var videoPrompt = '以上述生成图作为首帧，生成约 ' + durationFor(cells[1].textContent.trim()) + ' 秒视频。保持首帧中的角色身份、服装、机器人像素脸、鸵鸟外形、场景布局、光线方向和宽银幕构图不变。' + visual + '。镜头目的：' + narrative + '。动作遵循真实惯性，主体运动方向连续，一个镜头只保留当前描述中的主要运镜；结尾停在清楚、可接下一镜的姿态，不新增角色、文字、镜头跳切或无关动作。';
          var details = document.createElement('details');
          details.className = 'shot-prompts';
          var summary = document.createElement('summary');
          summary.textContent = '查看本镜头生图与图生视频提示词';
          details.appendChild(summary);
          var body = document.createElement('div');
          body.className = 'shot-prompts-body';
          addPromptBlock(body, '生图提示词', imagePrompt);
          addPromptBlock(body, '图生视频提示词', videoPrompt);
          details.appendChild(body);
          cells[2].appendChild(details);
        });
      }
    }).catch(function () {
      document.getElementById('content').innerHTML = '<p>课程加载失败，请直接打开 <a href="./' + doc + '">' + doc + '</a>。</p>';
    });
  </script>
  <script src="./theme.js?v=4"></script>
</body>
</html>
