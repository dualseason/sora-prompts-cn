<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="通过 ShotLab 官方看懂镜头手册学习景别、构图、视角、角度、机位和摄影机运动。">
  <title>看懂镜头｜丧尸清道夫 AI 电影课</title>
  <link rel="stylesheet" href="./book.css?v=16">
  <style>
    .shotlab-intro { width:min(1120px,calc(100% - 48px)); margin:0 auto; padding:28px 0 18px; }
    .shotlab-intro-inner { display:flex; align-items:flex-start; justify-content:space-between; gap:28px; }
    .shotlab-intro h1 { margin:0; color:var(--book-ink); font-family:"Noto Serif SC","Songti SC",serif; font-size:25px; line-height:1.5; }
    .shotlab-intro p { max-width:760px; margin:6px 0 0; color:var(--book-muted); font-size:13px; line-height:1.8; }
    .shotlab-open { flex:0 0 auto; padding:7px 14px; border:1px solid var(--book-line); border-radius:999px; color:var(--book-green); text-decoration:none; font-size:13px; }
    .shotlab-open:hover { border-color:var(--book-green); }
    .shotlab-frame-wrap { width:100%; height:calc(100vh - 154px); min-height:680px; border-top:1px solid var(--book-line); background:#f6f3ec; }
    .shotlab-frame { display:block; width:100%; height:100%; border:0; }
    .shotlab-fallback { display:none; width:min(720px,calc(100% - 40px)); margin:70px auto; color:var(--book-muted); }
    @media (max-width:800px) { .shotlab-intro { width:min(100% - 28px,1120px); padding:20px 0 14px; } .shotlab-intro-inner { display:block; } .shotlab-open { display:inline-block; margin-top:12px; } .shotlab-frame-wrap { height:calc(100vh - 190px); min-height:620px; } }
  </style>
</head>
<body>
  <header class="plain-header"><div class="plain-header-inner">
    <a class="plain-brand" href="./">丧尸清道夫 AI 电影课</a>
    <nav><a href="./seedance-workflow.html">流程总览</a><a href="./course.html?doc=zombie-scavenger-shot-analysis.md">原片拉片</a><a href="./lens-guide.html">看懂镜头</a><button class="theme-toggle" data-theme-toggle type="button">切换暗色</button></nav>
  </div></header>
  <section class="shotlab-intro"><div class="shotlab-intro-inner">
    <div><h1>ShotLab · 看懂镜头</h1><p>下方内容由 ShotLab 官方网站直接提供，本站不复制其文字、图片或数据。可用六类镜头语言、搜索、配图和动态演示学习镜头术语。</p></div>
    <a class="shotlab-open" href="https://shotlab.cc/guide/" target="_blank" rel="noopener noreferrer">在 ShotLab 官网打开</a>
  </div></section>
  <div class="shotlab-frame-wrap" id="shotlab-wrap">
    <iframe class="shotlab-frame" id="shotlab-frame" src="https://shotlab.cc/guide/" title="ShotLab 看懂镜头官方手册" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="shotlab-fallback" id="shotlab-fallback"><h2>无法载入 ShotLab</h2><p>浏览器或 ShotLab 可能限制了嵌入显示。请直接访问 <a href="https://shotlab.cc/guide/" target="_blank" rel="noopener noreferrer">ShotLab 官方看懂镜头手册</a>。</p></div>
  </div>
  <script src="./theme.js?v=4"></script>
  <script>
    var frame = document.getElementById('shotlab-frame');
    var fallback = document.getElementById('shotlab-fallback');
    var timer = setTimeout(function () { frame.hidden = true; fallback.style.display = 'block'; }, 12000);
    frame.addEventListener('load', function () { clearTimeout(timer); });
    frame.addEventListener('error', function () { clearTimeout(timer); frame.hidden = true; fallback.style.display = 'block'; });
  </script>
</body>
</html>
