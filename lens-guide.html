<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="中文电影镜头语言学习手册：景别、角度、构图、视角和摄影机运动。">
  <title>看懂镜头｜丧尸清道夫 AI 电影课</title>
  <link rel="stylesheet" href="./book.css?v=16">
  <style>
    .lens-page { width:min(1120px,calc(100% - 48px)); margin:0 auto; padding:58px 0 90px; }
    .lens-head { max-width:720px; padding-bottom:30px; border-bottom:1px solid var(--book-line); }
    .lens-head .kicker { margin:0 0 14px; color:var(--book-rust); font-size:13px; letter-spacing:.12em; }
    .lens-head h1 { margin:0; color:var(--book-ink); font-family:"Noto Serif SC","Songti SC",serif; font-size:clamp(36px,5vw,58px); line-height:1.35; }
    .lens-head p { margin:16px 0 0; color:var(--book-muted); font-size:18px; line-height:2; }
    .lens-tools { display:flex; gap:12px; align-items:center; margin:28px 0 34px; }
    .lens-search { width:min(540px,100%); padding:12px 16px; border:1px solid var(--book-line); border-radius:4px; color:var(--book-ink); background:transparent; font:inherit; }
    .lens-search:focus { outline:2px solid var(--book-green); outline-offset:2px; }
    .lens-count { color:var(--book-muted); font-size:13px; white-space:nowrap; }
    .lens-layout { display:grid; grid-template-columns:180px minmax(0,1fr); gap:52px; }
    .lens-tabs { position:sticky; top:90px; align-self:start; }
    .lens-tabs button { display:block; width:100%; padding:9px 0; border:0; border-bottom:1px solid var(--book-line); background:none; color:var(--book-muted); text-align:left; font:inherit; font-size:14px; cursor:pointer; }
    .lens-tabs button.active, .lens-tabs button:hover { color:var(--book-green); }
    .lens-group { margin:0 0 48px; }
    .lens-group[hidden], .lens-card[hidden] { display:none; }
    .lens-group h2 { margin:0 0 16px; padding-bottom:10px; border-bottom:2px solid var(--book-green); color:var(--book-ink); font-family:"Noto Serif SC","Songti SC",serif; font-size:24px; }
    .lens-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .lens-card { overflow:hidden; border:1px solid var(--book-line); background:transparent; }
    .lens-card img { display:block; width:100%; aspect-ratio:2.33/1; object-fit:cover; border-bottom:1px solid var(--book-line); }
    .lens-card-content { padding:14px; }
    .lens-card h3 { margin:0; color:var(--book-ink); font-family:"Noto Serif SC","Songti SC",serif; font-size:18px; }
    .lens-card p { margin:6px 0 12px; color:var(--book-muted); font-size:13px; line-height:1.7; }
    .lens-detail { margin:0 0 14px; padding:12px; border-top:1px solid var(--book-line); color:var(--book-muted); font-size:13px; line-height:1.75; }
    .lens-detail strong { color:var(--book-ink); }
    .lens-card button { padding:5px 10px; border:1px solid var(--book-line); border-radius:999px; background:transparent; color:var(--book-green); font:inherit; font-size:12px; cursor:pointer; }
    .lens-card button:hover { border-color:var(--book-green); }
    .lens-empty { padding:30px 0; color:var(--book-muted); }
    @media (max-width:800px) { .lens-page { width:min(100% - 28px,1120px); padding-top:42px; } .lens-layout { display:block; } .lens-tabs { position:static; display:flex; overflow:auto; gap:18px; margin-bottom:28px; border-bottom:1px solid var(--book-line); } .lens-tabs button { width:auto; flex:0 0 auto; border:0; white-space:nowrap; } .lens-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:500px) { .lens-tools { display:block; } .lens-count { display:block; margin-top:8px; } .lens-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="plain-header"><div class="plain-header-inner">
    <a class="plain-brand" href="./">丧尸清道夫 AI 电影课</a>
    <nav><a href="./seedance-workflow.html">流程总览</a><a href="./course.html?doc=zombie-scavenger-shot-analysis.md">原片拉片</a><a href="./lens-guide.html">看懂镜头</a><button class="theme-toggle" data-theme-toggle type="button">切换暗色</button></nav>
  </div></header>
  <main class="lens-page">
    <section class="lens-head">
      <p class="kicker">镜头语言参考手册</p>
      <h1>看懂镜头，再写提示词</h1>
      <p>把“特写、低角度、跟拍”从术语变成画面判断。先查清楚镜头是什么，再决定如何写进生图和视频提示词。</p>
    </section>
    <div class="lens-tools"><input class="lens-search" id="lens-search" type="search" placeholder="搜索镜头名称、用途或画面特征……"><span class="lens-count" id="lens-count"></span></div>
    <div class="lens-layout">
      <aside class="lens-tabs" aria-label="镜头分类">
        <button class="active" data-category="all">全部镜头</button><button data-category="size">景别</button><button data-category="angle">角度与机位</button><button data-category="composition">构图</button><button data-category="view">人物与视角</button><button data-category="movement">摄影机运动</button>
      </aside>
      <section id="lens-groups"></section>
    </div>
  </main>
  <footer><main>本站镜头解释和提示词示例为原创教学内容；图片来自本站镜头图库。镜头术语用于辅助创作判断。</main></footer>
  <script src="./theme.js?v=4"></script>
  <script>
    var groups = [
      { key:'size', title:'景别：画面给观众多少信息', items:[
        ['极远景','EXTREME_WIDE_SHOT.png','展示世界规模、孤独感和人物位置。','主体在画面中很小，环境承担主要信息。','适合建立场景、结尾留白和宏大转场。'],
        ['全景','WIDE_SHOT.png','完整展示人物与环境的关系。','人物通常能看清全身，周围空间仍然重要。','适合人物进入、离开和动作起势。'],
        ['中景','MEDIUM_SHOT.png','平衡人物动作与环境信息。','常见于腰部或胸部以上，动作可读且不疏远。','适合对话、走路、双人互动。'],
        ['中近景','MEDIUM_CLOSE-UP.png','让表情和上半身动作成为重点。','画面从胸口或肩部以上取景。','适合反应、对白和情绪转折。'],
        ['特写','CLOSE-UP.png','突出脸、手、道具或关键线索。','主体占据画面大部分，背景信息减少。','适合反应、线索揭示和剪辑接缝。'],
        ['极近特写','EXTREME_CLOSE-UP.png','放大眼睛、材质或细小动作。','只保留局部细节，空间关系被主动舍弃。','适合恐惧、喜剧细节和关键物件。']
      ]},
      { key:'angle', title:'角度与机位：从哪里看主体', items:[
        ['平视','EYE_LEVEL.png','让观众与主体处在相对平等的位置。','镜头高度接近人物眼睛或主体中心。','适合自然对话、观察和稳定叙事。'],
        ['低角度','LOW_ANGLE.png','让主体显得强大、危险或有压迫感。','镜头低于主体，向上拍摄。','适合机器人、反派、英雄出场。'],
        ['高角度','HIGH_ANGLE.png','让主体显得弱小、孤立或被观察。','镜头高于主体，向下拍摄。','适合困境、暴露和空间关系。'],
        ['鸟瞰','BIRD-EYE_VIEW.png','提供近似地图的全知视角。','镜头接近垂直向下。','适合展示队形、道路、城市和调度。'],
        ['虫眼角度','WORM-EYE_VIEW.png','把近处主体拍得异常巨大。','镜头贴近地面，强烈向上仰拍。','适合怪物、车辆和夸张动作。'],
        ['倾斜构图','DUTCH_ANGLE.png','制造失衡、不安或心理异常。','水平线故意倾斜，主体关系仍需清楚。','适合惊悚、醉态、故障和危险升级。']
      ]},
      { key:'composition', title:'构图：主体如何进入画面', items:[
        ['居中构图','CENTERED_COMPOSITION.png','让主体成为明确、稳定的视觉中心。','主体位于画面中轴，背景通常对称或简洁。','适合出场、肖像、仪式和正面冲突。'],
        ['三分法构图','RULE-OF-THIRDS_COMPOSITION.png','给视线和动作方向留下空间。','主体放在三分线附近，不把所有内容塞在中心。','适合行走、望向画外和对话。'],
        ['对称构图','SYMMETRICAL_SHOT.png','制造秩序、庄严或人为控制感。','画面两侧在形状、线条或重量上接近对称。','适合建筑、走廊、审讯和机械世界。'],
        ['引导线','LEADING_LINES_SHOT.png','用道路、栏杆和光线把观众带向主体。','画面中的线条朝向主体或消失点。','适合公路、追逐、进入房间和视线引导。'],
        ['前景框景','FOREGROUND_FRAMING_SHOT.png','用门框、窗框或物体制造窥视感。','前景遮挡画面边缘，主体位于中后景。','适合偷看、监视、关系隔阂和悬念。'],
        ['负空间','NEGATIVE_SPACE_SHOT.png','让空白表达等待、孤独或未知。','主体偏向一侧，大面积留白指向视线或动作。','适合结尾、离别、恐惧和等待。']
      ]},
      { key:'view', title:'人物与视角：观众站在谁的位置', items:[
        ['主观视角','FIRST-PERSON_SHOT.png','让观众直接站在角色眼睛里。','画面像角色亲眼所见，通常看不到完整主体。','适合恐怖、游戏感、发现和追逐。'],
        ['客观视角','THIRD-PERSON_SHOT.png','像旁观者一样观察人物行动。','主体完整出现在空间中，镜头不属于某个角色。','适合建立环境、动作和群像。'],
        ['过肩镜头','OVER-THE-SHOULDER_SHOT.png','在对话中同时保留两人的关系。','前景出现一侧肩膀，焦点落在对面人物。','适合正反打、质问、暧昧和对峙。'],
        ['双人镜头','TWO-SHOT.png','在同一画面里建立两个人的距离。','两个主体同时清楚，位置关系比单人表情重要。','适合初遇、伙伴、情侣和冲突。'],
        ['反应镜头','REACTION_SHOT.png','展示人物看到信息后的心理变化。','被看对象暂时离开或不重要，重点是表情和姿态。','适合喜剧、恐怖、爱情和反转。'],
        ['背影镜头','BACK-TO-CAMERA_ANGLE.png','保留人物身份，同时把注意力指向前方。','主体背对镜头，观众与它一起看向环境。','适合离开、等待、发现和沉浸。']
      ]},
      { key:'movement', title:'摄影机运动：让画面产生方向', items:[
        ['固定镜头','STATIC_SHOT.png','让观众观察动作发生，而不是追逐动作。','摄影机位置不变，运动来自主体或环境。','适合悬念、喜剧停顿、对话和结果镜头。'],
        ['推进','PUSH-IN_SHOT.png','逐渐靠近主体，增加关注和压力。','镜头物理向前移动，主体大小自然变化。','适合发现线索、情绪升级和揭示。'],
        ['拉远','PULL-BACK_SHOT.png','从局部退回环境，揭示更大关系。','镜头向后移动，空间信息逐步增加。','适合孤独、结尾、反差和世界展示。'],
        ['跟拍','TRACKING_SHOT.png','伴随人物移动，维持方向和节奏。','摄影机沿人物运动方向平移或后退。','适合走路、追逐、公路和连续动作。'],
        ['摇摄','PAN_SHOT.png','横向扫过空间，把信息依次交给观众。','摄影机位置大致不变，镜头水平转动。','适合揭示人物、寻找目标和空间连接。'],
        ['环绕','ARC_SHOT.png','改变人物与背景的相对关系。','摄影机沿主体弧线移动，视角持续变化。','适合英雄出场、关系确认和超现实效果。']
      ]}
    ];
    var groupsEl = document.getElementById('lens-groups');
    var search = document.getElementById('lens-search');
    var count = document.getElementById('lens-count');
    var active = 'all';
    function render() {
      var query = search.value.trim().toLowerCase();
      var total = 0;
      groupsEl.innerHTML = groups.map(function (group) {
        if (active !== 'all' && active !== group.key) return '';
        var items = group.items.filter(function (item) { return !query || item.join(' ').toLowerCase().indexOf(query) >= 0; });
        if (!items.length) return '';
        total += items.length;
        return '<section class="lens-group"><h2>' + group.title + '</h2><div class="lens-grid">' + items.map(function (item) {
          var prompt = item[0] + '，' + item[1] + '，' + item[2];
          return '<article class="lens-card"><img loading="lazy" src="./images/' + item[1] + '" alt="' + item[0] + '示例"><div class="lens-card-content"><h3>' + item[0] + '</h3><p>' + item[1] + '</p><div class="lens-detail"><strong>怎么识别：</strong>' + item[3] + '<br><strong>什么时候用：</strong>' + item[4] + '</div><button type="button" data-copy="' + encodeURIComponent(prompt) + '">复制到提示词</button></div></article>';
        }).join('') + '</div></section>';
      }).join('');
      count.textContent = '显示 ' + total + ' 个镜头';
      if (!total) groupsEl.innerHTML = '<p class="lens-empty">没有找到匹配的镜头。试试“特写”“低角度”或“跟拍”。</p>';
      groupsEl.querySelectorAll('[data-copy]').forEach(function (button) {
        button.addEventListener('click', function () {
          var text = decodeURIComponent(button.dataset.copy);
          navigator.clipboard.writeText(text).then(function () { button.textContent = '已复制'; setTimeout(function () { button.textContent = '复制到提示词'; }, 1200); });
        });
      });
    }
    document.querySelectorAll('[data-category]').forEach(function (button) { button.addEventListener('click', function () { active = button.dataset.category; document.querySelectorAll('[data-category]').forEach(function (item) { item.classList.toggle('active', item === button); }); render(); }); });
    search.addEventListener('input', render);
    render();
  </script>
</body>
</html>
