<!doctype html>
<html lang="zh-CN" data-theme-choice="light" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="ShotLab 中文电影镜头语言参考手册授权集成版。">
  <title>看懂镜头｜ShotLab 授权集成</title>
  <script>(function(){try{var m=localStorage.getItem('ai-film-theme');if(['light','dark'].indexOf(m)<0)m='light';document.documentElement.dataset.themeChoice=m;document.documentElement.dataset.theme=m}catch(e){}})();</script>
  <link rel="stylesheet" href="./styles.css">
  <script src="./theme.js" defer></script>
  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <noscript>本手册需要启用浏览器 JavaScript 才能搜索和点击。</noscript>
  <div id="app" class="app-shell" aria-busy="true"></div>
</body>
</html>
